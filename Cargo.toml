[package]
name = "morning_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", features = ["macros", "webhooks-axum"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-cron-scheduler = "0.13"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dotenv = "0.15"
log = "0.4"
pretty_env_logger = "0.5"

# Увеличиваем стек для debug-сборки (по умолчанию 2MB — мало для async фьюч)
[profile.dev]
opt-level = 1        # минимальная оптимизация убирает inline и сжимает фьючи

[profile.release]
opt-level = 3
lto = true
